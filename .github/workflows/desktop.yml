# Builds the desktop app (apps/desktop) for Linux, Windows and macOS, unsigned, checks that no artefact
# holds disc data, and on a version tag attaches the artefacts to the GitHub release. No disc data is
# involved at any point: it is DK's material, never in git, CI or a release. Users bring their own disc
# image (apps/desktop/README.md).
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-24.04, arch: x64 }
          - { label: windows-x64, os: windows-2025, arch: x64 }
          - { label: macos-arm64, os: macos-15, arch: arm64 }
          - { label: macos-x64, os: macos-15, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Installs the pnpm version pinned by "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      # Frozen lockfile, dependency scripts blocked (pnpm-workspace.yaml). Electron's binary is fetched,
      # and checked against the checksums in its npm package, only when first used.
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
        if: runner.os == 'Linux'

      # The web app's build, then the main process, preload and disc chooser around it (dist/app).
      - name: Build
        run: pnpm --filter @twtw/desktop build

      # @electron/packager for this runner's platform, asar, fuses, archive in dist/release.
      - name: Package
        run: pnpm --filter @twtw/desktop run package --arch ${{ matrix.arch }}

      # Unpacks each archive and its app.asar: disc file names, a data manifest, disc file signatures,
      # the disc's page database under any name, or a large unknown file all fail the build.
      - name: The artefacts hold no disc data
        run: pnpm --filter @twtw/desktop check:artefacts

      # The first-run disc chooser, and its refusal of files that are not the disc (no disc on CI).
      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @twtw/desktop test:e2e

      - name: Artefact sizes
        shell: bash
        run: ls -l apps/desktop/dist/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.label }}
          path: apps/desktop/dist/release/*
          if-no-files-found: error
          retention-days: 14

  # On a tag: attach every artefact, and their SHA-256 sums, to the tag's release. A new release is
  # created as a draft, to be read over and published by hand.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach to the release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "The Way Things Work $TAG" \
              --notes "Desktop app, unsigned builds for Linux, Windows and macOS. It contains no disc content: you need your own disc image of The Way Things Work (Dorling Kindersley, 1994). See apps/desktop/README.md."
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber -- *
