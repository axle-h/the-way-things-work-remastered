# DOSBox-X base config for a 1994-era Windows 3.1 multimedia PC.
# Machine: 486-class CPU, 16 MB RAM, S3 Trio64 SVGA (2 MB), Sound Blaster 16 @ 220/7/1/5,
# OPL3 FM, ATAPI CD-ROM. Path-dependent bits ([autoexec], mounts) are supplied by the
# launch scripts via -conf layering or -c commands.

[sdl]
output            = surface
windowresolution  = original
showmenu          = false
autolock          = false
fullscreen        = false

[dosbox]
title             = Win31
machine           = svga_s3trio64
memsize           = 16
vmemsize          = 2
fastbioslogo      = true
startbanner       = false
quit warning      = false
captures          = capture

[render]
aspect            = false
scaler            = none

[cpu]
core              = normal
cputype           = 486
cycles            = max

[sblaster]
sbtype            = sb16
sbbase            = 220
irq               = 7
dma               = 1
hdma              = 5
oplmode           = auto

[mixer]
rate              = 44100

[dos]
ver               = 6.22
lfn               = false
xms               = true
ems               = true
umb               = true

[ide, primary]
enable            = true

[ide, secondary]
enable            = true

# Standalone use (run from vendor/emu so the relative paths resolve):
#   cd vendor/emu && dosbox-x -conf ../../emu/twtw.conf
# Boots the real MS-DOS 6.22 install on hdd.img; AUTOEXEC.BAT calls C:\AUTORUN.BAT
# (emu/twtw.sh rewrites that file to pick game / Windows / DOS prompt).
[autoexec]
imgmount 2 hdd.img -t hdd -fs none
imgmount d "../Way Things Work, The (1994)(Dorling Kindersley).iso" -t iso -ide 2m
boot c:
